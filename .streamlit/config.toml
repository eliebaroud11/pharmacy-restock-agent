[server]
# Only reachable from this computer. Change to 0.0.0.0 only on a trusted network.
address = "localhost"
headless = true
# Invoice photos are a few MB at most; refuse anything bigger.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Hide the developer menu and "Deploy" button.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#137A59"
backgroundColor = "#F6F8F5"
secondaryBackgroundColor = "#E9EFEA"
textColor = "#0F2E2C"
font = "sans serif"
