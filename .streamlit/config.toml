[server]
# Only reachable from this computer. Change to 0.0.0.0 only on a trusted network.
address = "localhost"
headless = true
# Invoice photos are a few MB at most; refuse anything bigger.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Hide the developer menu and "Deploy" button.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F2937"
backgroundColor = "#F9FAFB"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
font = "sans serif"
